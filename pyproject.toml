[project]
name = "geneask"
version = "0.1.0"
description = "Human genome variant interpretation (ClinVar screen, traits, pharmacogenomics) — sibling to MethylAsk"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    # GoodAncestor/bio-core — shared mechanism (private repo). git-source so a clean
    # install resolves from GitHub; private-repo access uses git credentials (see README).
    "biocore @ git+https://github.com/GoodAncestor/bio-core.git",
    # GRCh37->38 liftover for build-37 consumer arrays (panel is GRCh38); uses the
    # bundled UCSC chain. Without it, build-37 uploads silently match no ClinVar sites.
    "pyliftover",
]

[project.optional-dependencies]
ingest = ["pysam"]   # 23andMe/CG -> VCF anchoring
alphagenome = ["alphagenome"]   # regulatory VEP enrichment (opt-in, key-gated); heavy dep, imported lazily

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geneask*"]

[tool.setuptools.package-data]
"geneask" = ["data/reference/*.json.gz", "data/reference/*.json", "data/reference/*.csv",
             "data/reference/chains/*.chain.gz"]
